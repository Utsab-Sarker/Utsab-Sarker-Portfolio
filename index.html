<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Utsab Sarker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <script>
    setTimeout(function() {
      window.location.href = "./bn/"; 
    }, 2500);
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1a1a24 0%, #0f0f11 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* ব্যাকগ্রাউন্ড অ্যানিমেশনের জন্য ভাসমান কণা (Particles) */
    .particle {
      position: absolute;
      bottom: -10px;
      background: rgba(255, 219, 112, 0.2);
      border-radius: 50%;
      pointer-events: none;
      animation: floatUp 3s linear infinite;
    }

    /* বিভিন্ন সাইজের কণার জন্য কাস্টম অ্যানিমেশন */
    .particle:nth-child(1) { left: 10%; width: 8px; height: 8px; animation-duration: 2.5s; animation-delay: 0.2s; }
    .particle:nth-child(2) { left: 30%; width: 12px; height: 12px; animation-duration: 3.5s; animation-delay: 0.5s; }
    .particle:nth-child(3) { left: 50%; width: 6px; height: 6px; animation-duration: 2.8s; animation-delay: 0s; }
    .particle:nth-child(4) { left: 70%; width: 14px; height: 14px; animation-duration: 4s; animation-delay: 0.8s; }
    .particle:nth-child(5) { left: 85%; width: 10px; height: 10px; animation-duration: 3.2s; animation-delay: 0.3s; }

    /* কন্টেইনার (যা টেক্সটগুলোকে ওপরে রাখবে) */
    .content-box {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    /* ওয়েলকাম টেক্সটের ডিজাইন ও অ্যানিমেশন */
    .welcome-text {
      font-size: 1.1rem;
      color: #9b9b9b;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeInDown 0.8s ease-out forwards;
    }

    /* নামের ডিজাইন ও দোল খাওয়ার অ্যানিমেশন */
    .loading-name {
      font-family: 'Pacifico', cursive;
      font-size: 4.2rem;
      color: #ffdb70;
      text-shadow: 0 0 25px rgba(255, 219, 112, 0.5);
      opacity: 0;
      display: inline-block;
      animation: fadeInUp 0.8s ease-out 0.4s forwards, waveAndSwing 2s ease-in-out infinite 1.2s;
    }

    /* প্রিমিয়াম লোডিং বার */
    .loader-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 219, 112, 0.1);
      margin: 30px auto 0;
      border-radius: 3px;
      overflow: hidden;
    }
    .loader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffdb70, #ffa100);
      animation: loadTime 2.5s linear forwards;
      transform-origin: left;
    }

    /* অ্যানিমেশন কি-ফ্রেমসমূহ */
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-105vh) scale(0.5);
        opacity: 0;
      }
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes waveAndSwing {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(-4deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(12px) rotate(4deg); }
    }

    @keyframes loadTime {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
  </style>
</head>
<body>

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="content-box">
    <div class="welcome-text">Welcome to my space</div>

    <div class="loading-name">Utsab Sarker</div>

    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>

</body>
</html>
