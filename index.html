  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Redirect to Bengali homepage -->

    window.setTimeout(function () {

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }

    /* Floating Modern Blur Orbs */
    .bg-orb {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(37, 99, 235, 0.05);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }

    .bg-orb:nth-child(2) {
      width: 250px;
      height: 250px;
      background: rgba(59, 130, 246, 0.07);
      right: 10%;
      top: 15%;
      animation-delay: -3s;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* Modern Glassmorphic Console Card */
    .content-box {
      position: relative;
      z-index: 10;
      text-align: left;
      padding: 30px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02);
      max-width: 90%;
      width: 440px;
      opacity: 0;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }

    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .terminal-title {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: #64748b;
      margin-left: auto;
      font-weight: 600;
    }

    .name-banner {
      text-align: center;
      margin-bottom: 20px;
    }

    .name-en {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.01em;
    }

    .name-bn {
      font-size: 0.95rem;
      font-weight: 700;
      color: #2563eb;
      margin-top: 2px;
    }

    /* Connection Status Console Logs */
    .console-logs {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeInLog 0.4s ease forwards;
    }

    .log-item:nth-child(1) { animation-delay: 0.3s; }
    .log-item:nth-child(2) { animation-delay: 1s; }
    .log-item:nth-child(3) { animation-delay: 1.8s; }
    .log-item:nth-child(4) { animation-delay: 2.6s; }

    .log-item i {
      font-size: 0.85rem;
    }

    .log-success { color: #16a34a; }
    .log-pending { color: #d97706; }

    /* Sleek Loading Bar */
    .loader-wrapper {
      width: 100%;
      background: #f1f5f9;
      height: 5px;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
      background-size: 200% 100%;
      animation: loadTime 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmer 2s infinite linear;
      transform-origin: left;
      transform: scaleX(0);
      border-radius: 5px;
    }

    @keyframes cardEntrance {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInLog {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loadTime {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content-box, .log-item, .loader-progress, .bg-orb {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .loader-progress { transform: scaleX(1); }
    }
  </style>
</head>

<body>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>

  <main class="content-box">
    <div class="terminal-header">
      <div class="terminal-dot dot-red"></div>
      <div class="terminal-dot dot-yellow"></div>
      <div class="terminal-dot dot-green"></div>
      <div class="terminal-title">system_secure.env</div>
    </div>

    <div class="name-banner">
      <h1 class="name-en">Utsab Sarker</h1>
      <div class="name-bn">উৎসব সরকার</div>
    </div>

    <div class="console-logs">
      <div class="log-item">
        <i class="fa-solid fa-check log-success"></i>
        <span>Connection Checking: Secure <span style="color:#64748b; font-size:0.75rem;">(কানেকশন সিকিউরড)</span></span>
      </div>
      <div class="log-item">
        <i class="fa-solid fa-spinner fa-spin log-pending"></i>
        <span>Backend Connecting... <span style="color:#64748b; font-size:0.75rem;">(সার্ভার যুক্ত হচ্ছে...)</span></span>
      </div>
      <div class="log-item">
        <i class="fa-solid fa-shield-halved log-success"></i>
        <span>SSL Handshake: Verified <span style="color:#64748b; font-size:0.75rem;">(ভেরিফাইড)</span></span>
      </div>
      <div class="log-item">
        <i class="fa-solid fa-terminal log-success"></i>
        <span>Initializing Environment... <span style="color:#64748b; font-size:0.75rem;">(লোড হচ্ছে...)</span></span>
      </div>
    </div>

    <div class="loader-wrapper" aria-label="Loading">
      <div class="loader-progress"></div>
    </div>
  </main>
</body>
</html>
